# ZAP scan rules. Read by zap-api-scan via `-c`, so this file is TSV, not a .properties file.
# SPEC section 20 Security layer: "OWASP ZAP baseline in CI; zero high/critical open".
#
# Format, from the scanner's own parser (zap_common.load_config):
#   <rule id> TAB <level> TAB <description>
# - `#` comment lines and blank lines are skipped.
# - Every other line must contain at least two tabs, or the scanner exits 3 and the scan dies.
# - Level is one of IGNORE, INFO, WARN, FAIL.
#
# Two ways this file has already failed silently, both worth remembering:
# 1. Written as `90004=IGNORE` (properties). action-api-scan reads the file with
#    processLineByLine and only counts a line when the second tab-separated field is IGNORE;
#    with no tab at all that read throws, is swallowed, and the action then omits `-c`
#    entirely. The scan ran green while ignoring this file completely (run 37264756936).
# 2. Kept ASCII on purpose. The scanner reads a local file with plain open(), which takes the
#    image's locale encoding (C.UTF-8 today), unlike the URL path which decodes UTF-8
#    explicitly. There is no reason for this file to sit on that dependency.
#
# Every rule id below was read off a real scan of this API rather than invented. A rule id
# typed in from memory is a guess wearing the authority of a measurement, and a wrong guess
# either hides a finding or breaks the scan.

# ---------------------------------------------------------------------------
# 90004 - Cross-Origin-Resource-Policy Header Missing or Invalid
#
# Accepted risk. Rationale:
#
#   v1 consumers are the Flutter app and server-to-server gateways; bearer tokens, no cookie
#   auth, no browser-embedding scenario. Revisit if a web client ships.
#
# The rule exists to stop another origin loading a response and reading it. That needs either
# a browser session riding along - a cookie - or a user opening this API in a page on another
# origin. Neither happens here: authentication is a bearer token the caller attaches
# explicitly, so a cross-origin page cannot cause a request that carries credentials, and
# there is no page of ours that embeds these responses. Adding the header would be
# indistinguishable from noise.
#
# "Revisit if a web client ships" is the condition, not a formality: the day a browser is a
# first-class client, the reasoning above stops applying and this override must go.
# ---------------------------------------------------------------------------
90004	IGNORE	(Cross-Origin-Resource-Policy Header Missing or Invalid)