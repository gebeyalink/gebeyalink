# ZAP scan rules — properties format.
# Referenced by .github/workflows/ci.yml as `rules_file_name`, which is the input name both
# zaproxy/action-baseline and zaproxy/action-api-scan use. It served the baseline scan when
# the target was a URL, and it serves the API scan now that the target is the OpenAPI
# description: same input, same file, and the overrides in it apply to both.
# SPEC §20 Security layer: "OWASP ZAP baseline in CI; zero high/critical open".
#
# Phase 0: this file intentionally declares NO rule overrides. An empty rules file is
# the correct baseline starting point — the scan runs against ZAP's default rule set,
# which is what a baseline scan is meant to measure. Rule IDs are NOT listed here on
# purpose: inventing rule IDs without verifying them against the pinned ZAP image would
# be unverified configuration, so overrides get added only once a real scan has been read
# and the rule IDs can be taken off its report.

# No overrides yet. Lines below this comment are the place to add verified rule IDs.