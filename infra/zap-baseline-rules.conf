# ZAP baseline scan rules — properties format.
# Referenced by .github/workflows/ci.yml via zaproxy/action-baseline `rules_file_name`.
# SPEC §20 Security layer: "OWASP ZAP baseline in CI; zero high/critical open".
#
# Phase 0: this file intentionally declares NO rule overrides. An empty rules file is
# the correct baseline starting point — the scan runs against ZAP's default rule set,
# which is what a baseline scan is meant to measure. Rule IDs are NOT listed here on
# purpose: inventing rule IDs without verifying them against the pinned ZAP image would
# be unverified configuration, so overrides get added only once the API target exists
# and the rule IDs can be read off a real scan.

# No overrides yet. Lines below this comment are the place to add verified rule IDs.
