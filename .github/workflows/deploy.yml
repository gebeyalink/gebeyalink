name: deploy

# SPEC §21 — Deploy pipeline: staging automatic, production manual-approve.
# Order: migration dry-run -> deploy API (blue/green, health-gated) -> smoke tests
#        -> mobile build to Play internal track -> admin deploy.
# Rollback = previous image + backward-compatible migrations ONLY
#            (expand/contract pattern; never delete/rename in one release).
#
# TRIGGER GUARD (confirmed): this workflow does NOT run on feature-branch pushes or on
# PRs. It runs only on `push` to `main` (staging, automatic) or a `v*` tag (production,
# gated by the `prod` environment's required reviewers), plus manual `workflow_dispatch`
# where the operator must choose staging or prod explicitly. Every deploy step is still
# gated on the presence of the script it calls: infra/deploy.sh, infra/smoke.sh and
# infra/Dockerfile.api land with the deploy-automation task, not in Phase 0.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: target environment
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  id-token: write # OIDC to cloud provider — no long-lived secrets (SPEC §17.1)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  PYTHON_VERSION: '3.12'

jobs:
  migration-dry-run:
    name: migration dry-run (expand/contract)
    runs-on: ubuntu-latest
    # Gated: alembic has no migration history until the first slice creates it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: detect alembic migrations
        id: gate
        run: |
          if [ -n "$(find apps/api/alembic -type f -name '*.py' -not -path '*/.*' | head -n1)" ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "RUNNING: migration dry-run"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no alembic migrations yet (activates when the first migration lands)"
          fi
      - run: pip install -e '.[dev]'
        if: steps.gate.outputs.count != '0'
      # Applies migrations to a disposable copy of the current schema, then asserts the
      # downgrade path also succeeds. A failed downgrade means the release is not
      # backward-compatible -> blocked, per SPEC §21 rollback rule.
      # From the repository root: alembic.ini lives there and its script_location is
      # relative to it. Running from apps/api finds no ini file at all.
      - name: upgrade dry-run
        if: steps.gate.outputs.count != '0'
        run: alembic upgrade head --sql > /tmp/upgrade.sql
      # `head:base` rather than `-1`: a relative downgrade has no current revision to count
      # back from when nothing is connected. The whole chain is rendered so a release that
      # cannot reverse is caught here, not halfway through a rollback.
      - name: downgrade dry-run
        if: steps.gate.outputs.count != '0'
        run: alembic downgrade 'head:base' --sql > /tmp/downgrade.sql
      # Guard: expand/contract forbids drop/rename in a single release.
      - name: assert no destructive DDL
        if: steps.gate.outputs.count != '0'
        run: |
          if grep -Eiq '\b(DROP\s+(COLUMN|TABLE)|RENAME)\b' /tmp/upgrade.sql; then
            echo "::error::destructive migration in upgrade path (SPEC §21 expand/contract violation)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.count != '0'
        with:
          name: migration-sql
          path: /tmp/*.sql

  deploy-staging:
    name: deploy staging (auto)
    runs-on: ubuntu-latest
    needs: [migration-dry-run]
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: detect deploy scripts
        id: gate
        run: |
          ok=1
          for f in infra/deploy.sh infra/smoke.sh; do
            [ -f "$f" ] || { echo "missing: $f"; ok=0; }
          done
          echo "count=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" -eq 0 ]; then
            echo "SKIPPED: deploy automation not landed yet (activates with infra/deploy.sh + infra/smoke.sh)"
          else
            echo "RUNNING: staging deploy"
          fi
      - name: apply migrations
        if: steps.gate.outputs.count == '1'
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: deploy API (blue/green)
        id: deploy
        if: steps.gate.outputs.count == '1'
        run: ./infra/deploy.sh api staging
      - name: smoke tests
        if: steps.gate.outputs.count == '1'
        run: ./infra/smoke.sh staging
      - name: admin deploy
        if: steps.gate.outputs.count == '1'
        run: ./infra/deploy.sh admin staging

  deploy-prod:
    name: deploy prod (manual approve)
    runs-on: ubuntu-latest
    needs: [migration-dry-run]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: prod # environment-level required reviewers = the manual-approve gate
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: detect deploy scripts
        id: gate
        run: |
          ok=1
          for f in infra/deploy.sh infra/smoke.sh; do
            [ -f "$f" ] || { echo "missing: $f"; ok=0; }
          done
          echo "count=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" -eq 0 ]; then
            echo "SKIPPED: deploy automation not landed yet (activates with infra/deploy.sh + infra/smoke.sh)"
          else
            echo "RUNNING: production deploy (manual approval gate)"
          fi
      - name: apply migrations
        if: steps.gate.outputs.count == '1'
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - name: deploy API (blue/green)
        id: deploy
        if: steps.gate.outputs.count == '1'
        run: ./infra/deploy.sh api prod
      - name: smoke tests
        if: steps.gate.outputs.count == '1'
        run: ./infra/smoke.sh prod
      - name: rollback (previous image) on failure
        if: failure() && steps.gate.outputs.count == '1'
        run: ./infra/deploy.sh api prod --rollback
      - name: admin deploy
        if: steps.gate.outputs.count == '1'
        run: ./infra/deploy.sh admin prod

  mobile-internal-track:
    name: mobile -> Play internal track
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: detect mobile manifest
        id: gate
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "RUNNING: mobile build (package et.gebeyalink.mobile)"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no apps/mobile/pubspec.yaml yet (activates when the manifest lands)"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.count == '1'
        with:
          flutter-version: '3.24.x'
      - run: flutter pub get
        if: steps.gate.outputs.count == '1'
      - run: flutter build appbundle --release
        if: steps.gate.outputs.count == '1'
        working-directory: apps/mobile
      - uses: fastlane/fastlane-action@v2
        if: steps.gate.outputs.count == '1'
        with:
          lane: internal
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  rollback:
    name: rollback
    runs-on: ubuntu-latest
    if: failure() && startsWith(github.ref, 'refs/tags/v')
    needs: [deploy-prod]
    steps:
      - uses: actions/checkout@v4
      - name: detect deploy script
        id: gate
        run: |
          if [ -f infra/deploy.sh ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no infra/deploy.sh yet (activates with deploy automation)"
          fi
      # SPEC §21: rollback = previous image + backward-compatible migrations only.
      # No data rollback. Never a down-migration of an applied release.
      - run: ./infra/deploy.sh api prod --rollback
        if: steps.gate.outputs.count == '1'
