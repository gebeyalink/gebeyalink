name: ci

# SPEC §21 — PR pipeline, in the mandated order:
#   lint -> typecheck -> i18n-keys -> unit -> integration (ephemeral DB) -> USSD harness
#        -> coverage gate -> build artifacts -> ZAP baseline
# SPEC §19 — mypy strict on apps/api and packages/*; ruff/black; pytest.
# NFR-07 — the i18n-keys job is an addition to that order, not a replacement: it is the
# named job the pipeline fails on when a language is missing a key or a placeholder.
#
# Phase 0 reality: there is no application source yet. Rather than ship a permanently
# red pipeline, each layer job performs a REAL collection probe first. If a layer has
# no tests it prints "SKIPPED: no <layer> tests yet (activates with first <layer> test)"
# and the job exits 0. This is a genuine skip with a visible reason in the log — not
# continue-on-error and not `|| true`. The moment the first test of that layer lands,
# the probe finds it and the job runs for real.
# lint and typecheck stay active throughout: they already act on test_skeleton.py.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# SPEC §21 — PRs required, CI green to merge.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff black
      - name: ruff
        run: ruff check apps/api packages
      - name: black
        run: black --check apps/api packages

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    # Always active in Phase 0: apps/api/tests/test_skeleton.py is a real .py file and
    # is typechecked. Gate exists so the job self-describes once sources appear.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: detect python sources
        id: gate
        run: |
          n=$(find apps/api packages -type f -name '*.py' -not -path '*/.*' | grep -c . || true)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -eq 0 ]; then
            echo "SKIPPED: no python sources yet (activates with first module under apps/api or packages)"
          else
            echo "RUNNING: ${n} python source file(s) to typecheck"
          fi
      - run: pip install -e '.[dev]'
        if: steps.gate.outputs.count != '0'
      # SPEC §19: mypy strict on apps/api, packages/*. No __init__.py files are created
      # to satisfy this — those are source code and remain deferred.
      - name: mypy strict
        if: steps.gate.outputs.count != '0'
        run: mypy --strict apps/api packages

  i18n-keys:
    name: i18n-keys (key and placeholder parity)
    runs-on: ubuntu-latest
    # NFR-07 — a key one language does not speak, or a placeholder one translation forgot,
    # must be a red build. The runtime fallback to English keeps a request answering, so
    # nothing else in the pipeline would notice either gap. Runs after typecheck; no
    # continue-on-error, so a missing key fails the pipeline rather than warning in a log.
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: every key spoken in every language
        run: pytest apps/api/tests/test_NFR_07_i18n_key_parity.py -m unit -q

  unit:
    name: unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: pytest unit
        run: pytest apps/api/tests -m unit -q

  integration:
    name: integration (ephemeral postgres)
    runs-on: ubuntu-latest
    # SPEC §21: integration against an ephemeral DB. testcontainers (SPEC §20) is used by
    # the tests themselves; this service block is the fallback harness for suites needing a
    # pre-started instance (e.g. Alembic migration tests).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gebeyalink
          POSTGRES_PASSWORD: gebeyalink
          POSTGRES_DB: gebeyalink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://gebeyalink:gebeyalink@localhost:5432/gebeyalink_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: detect integration tests
        id: gate
        run: |
          out=$(pytest --collect-only -q -m integration 2>&1); rc=$?
          n=$(printf '%s\n' "$out" | grep -c '::' || true)
          echo "collect-exit=${rc} collected=${n:-0}"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -eq 0 ]; then
            echo "SKIPPED: no integration tests yet (activates with first integration test)"
          else
            echo "RUNNING: ${n} integration test(s) collected"
          fi
      - name: pytest integration
        if: steps.gate.outputs.count != '0'
        run: pytest apps/api/tests -m integration -q

  ussd:
    name: USSD/SMS harness
    runs-on: ubuntu-latest
    # SPEC §20: full §14.3 journeys via simulator harness; SMS command parser matrix.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: detect ussd tests
        id: gate
        run: |
          out=$(pytest --collect-only -q packages/ussd apps/api/tests -m ussd 2>&1); rc=$?
          n=$(printf '%s\n' "$out" | grep -c '::' || true)
          echo "collect-exit=${rc} collected=${n:-0}"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -eq 0 ]; then
            echo "SKIPPED: no ussd tests yet (activates with first ussd test)"
          else
            echo "RUNNING: ${n} ussd test(s) collected"
          fi
      - name: USSD journeys + SMS parser matrix
        if: steps.gate.outputs.count != '0'
        run: pytest packages/ussd apps/api/tests -m ussd -q

  e2e:
    name: e2e journeys
    runs-on: ubuntu-latest
    # SPEC §20 references apps/api/tests/e2e/ for the verbatim Gherkin features.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: detect e2e tests
        id: gate
        run: |
          out=$(pytest --collect-only -q apps/api/tests/e2e -m e2e 2>&1); rc=$?
          n=$(printf '%s\n' "$out" | grep -c '::' || true)
          echo "collect-exit=${rc} collected=${n:-0}"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -eq 0 ]; then
            echo "SKIPPED: no e2e tests yet (activates with first e2e test)"
          else
            echo "RUNNING: ${n} e2e test(s) collected"
          fi
      - name: pytest e2e
        if: steps.gate.outputs.count != '0'
        run: pytest apps/api/tests/e2e -m e2e -q

  load:
    name: load (k6)
    runs-on: ubuntu-latest
    # SPEC §20 load layer: k6, 200 rps API mix, USSD 50 rps, webhook burst 600/min.
    # SPEC §20 gates this at "NFR-01/02 met in staging" — this PR job is the smoke form;
    # the full scenario is promoted to deploy.yml against staging.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: detect load tests
        id: gate
        run: |
          out=$(pytest --collect-only -q apps/api/tests -m load 2>&1); rc=$?
          n=$(printf '%s\n' "$out" | grep -c '::' || true)
          echo "collect-exit=${rc} collected=${n:-0}"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          if [ "${n:-0}" -eq 0 ]; then
            echo "SKIPPED: no load tests yet (activates with first load test)"
          else
            echo "RUNNING: ${n} load test(s) collected"
          fi
      - name: pytest load
        if: steps.gate.outputs.count != '0'
        run: pytest apps/api/tests -m load -q

  coverage-gate:
    name: coverage gate
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: pytest with coverage
        run: pytest apps/api/tests -m 'unit or integration' --cov=apps/api --cov=packages \
             --cov-report=xml --cov-report=term -q
      # SPEC §20: >=85% line coverage on services/ and packages/*; >=70% overall.
      - name: scoped gate (>=85% on services/ + packages/*)
        run: pytest apps/api/tests -m 'unit or integration' --cov=apps/api/services \
             --cov=packages --cov-fail-under=85 -q
      - name: overall gate (>=70%)
        run: pytest apps/api/tests -m 'unit or integration' --cov=apps/api --cov=packages \
             --cov-fail-under=70 -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: |

  build-artifacts:
    name: build artifacts
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, coverage-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: detect API Dockerfile
        id: gate
        run: |
          if [ -f infra/Dockerfile.api ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "RUNNING: building API image from infra/Dockerfile.api"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no infra/Dockerfile.api yet (activates when the Dockerfile lands)"
          fi
      - name: build API image
        if: steps.gate.outputs.count != '0'
        run: docker build -f infra/Dockerfile.api -t gebeyalink/api:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.count != '0'
        with:
          name: api-dockerfile
          path: infra/Dockerfile.api

  build-mobile:
    name: build mobile (Flutter)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, coverage-gate]
    # Gated on the manifest existing: apps/mobile/pubspec.yaml is not created yet.
    # Package name is pinned by user decision: et.gebeyalink.mobile (reverse-domain of
    # gebeyalink.et). Flutter 3 per SPEC §18.2.
    #
    # Probed in a step and reported through $GITHUB_OUTPUT, the same idiom every other gate
    # in this file uses. hashFiles() is not available at job-level `if:` here, and one
    # gating idiom across the file is worth more than the brevity of the alternative.
    steps:
      - uses: actions/checkout@v4
      - name: detect mobile manifest
        id: gate
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "RUNNING: mobile build (package et.gebeyalink.mobile)"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no apps/mobile/pubspec.yaml yet (activates when the manifest lands)"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.count != '0'
        with:
          flutter-version: '3.24.x'
      - run: flutter pub get
        if: steps.gate.outputs.count != '0'
      - run: flutter analyze
        if: steps.gate.outputs.count != '0'
      - run: flutter test
        if: steps.gate.outputs.count != '0'
      - run: flutter build apk --debug
        if: steps.gate.outputs.count != '0'
      # SPEC §20: widget tests for critical flows; Android emulator CI is the merge gate
      # for app changes (emulator job lands with the mobile test suite).

  build-admin:
    name: build admin (React)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, coverage-gate]
    # Gated on apps/admin/package.json existing. Package name is pinned by user decision:
    # et.gebeyalink.admin. React 18 + TypeScript + MUI per SPEC §18.2.
    #
    # Probed in a step, not with hashFiles(): same idiom as build-mobile and every other
    # gate in this file.
    steps:
      - uses: actions/checkout@v4
      - name: detect admin manifest
        id: gate
        run: |
          if [ -f apps/admin/package.json ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "RUNNING: admin build (package et.gebeyalink.admin)"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no apps/admin/package.json yet (activates when the manifest lands)"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.count != '0'
        with:
          node-version: '22'
      - run: npm ci
        if: steps.gate.outputs.count != '0'
        working-directory: apps/admin
      - run: npm run lint
        if: steps.gate.outputs.count != '0'
        working-directory: apps/admin
      - run: npm run typecheck
        if: steps.gate.outputs.count != '0'
        working-directory: apps/admin
      - run: npm test
        if: steps.gate.outputs.count != '0'
        working-directory: apps/admin
      - run: npm run build
        if: steps.gate.outputs.count != '0'
        working-directory: apps/admin

  zap-baseline:
    name: ZAP baseline (security)
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    # SPEC §20: OWASP ZAP baseline in CI; zero high/critical open.
    # Standard documented path: zaproxy/action-baseline with the `rules_file_name` input
    # (properties-format rules file). No autogenrun / -config_file invocation is used.
    #
    # The API is BOOTED here rather than scanned as an absent target. A baseline scan
    # pointed at a port with nothing on it reports a clean result while having checked
    # nothing at all, which is worse than no gate: it looks like coverage. Same two images
    # the integration suite starts, so the scanner sees the API against a real database
    # with a real geography column.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gebeyalink
          POSTGRES_PASSWORD: gebeyalink
          POSTGRES_DB: gebeyalink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gebeyalink:gebeyalink@localhost:5432/gebeyalink_test
      REDIS_URL: redis://localhost:6379/0
      TERMS_VERSION: '2026-01-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - name: generate a throwaway signing keypair
        # Generated per run and never written down. A key committed to the repository is a
        # key somebody could use, and a key copied out of a CI file becomes the template
        # somebody later deploys with. The pair only has to sign tokens for the few
        # seconds the process is up.
        run: |
          python - <<'PY' > "$RUNNER_TEMP/signing-keys.sh"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          private_pem = key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode()
          public_pem = (
              key.public_key()
              .public_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PublicFormat.SubjectPublicKeyInfo,
              )
              .decode()
          )
          print(f"export SIGNING_PRIVATE_KEY='{private_pem}'")
          print(f"export SIGNING_PUBLIC_KEY='{public_pem}'")
          PY
      - name: apply migrations
        run: alembic upgrade head
      - name: boot the API
        run: |
          . "$RUNNER_TEMP/signing-keys.sh"
          nohup python -m uvicorn apps.api.main:app \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/api.pid"
      - name: wait for the API to serve
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "api is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API did not answer /health"
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@master
        with:
          rules_file_name: infra/zap-baseline-rules.conf
          docker-image: ghcr.io/zaproxy/zaproxy:stable
          target: http://host.docker.internal:8000
      - name: stop the API
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.count != '0'
        with:
          name: zap-baseline-report
          path: |

  ci-green:
    name: ci green (merge gate)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - i18n-keys
      - unit
      - integration
      - ussd
      - e2e
      - load
      - coverage-gate
      - build-artifacts
      - build-mobile
      - build-admin
      - zap-baseline
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          echo 'results:'
          for r in ${{ needs.*.result }}; do
            echo "  $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "CI not green"; exit 1
            fi
          done
