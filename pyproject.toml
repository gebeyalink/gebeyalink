# Tooling + shared-distribution config for apps/api and packages/*.

[project]
name = "gebeyalink"
version = "0.1.0"
description = "GebeyaLink — agricultural marketplace (Ethiopia)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# CI installs `.[dev]`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]

[tool.setuptools]
# Explicit list: prevents setuptools flat-layout auto-discovery from scanning apps/ and
# packages/ and failing with "multiple top-level packages discovered".
packages = [
    "apps",
    "apps.api",
    "apps.api.alembic",
    "apps.api.core",
    "apps.api.db",
    "apps.api.models",
    "apps.api.providers",
    "apps.api.repositories",
    "apps.api.routers",
    "apps.api.services",
    "packages",
    "packages.shared",
    "packages.shared.i18n",
]

# ── SPEC §19: mypy strict on apps/api, packages/* ─────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# Imports are written relative to the repository root, so that is the only path needed.
# Listing the narrower directories as well would give the same file two module names, which
# mypy rejects outright.
mypy_path = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/mobile", "apps/admin", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test names carry the requirement they prove, which the naming checklist requires; the
# lowercase-function-name rule does not apply to them.
"apps/api/tests/*" = ["N802"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(apps/mobile|apps/admin|infra)/"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
# Only the repository root: every import is absolute from there (``apps.api...``,
# ``packages.shared...``). Adding the narrower directories would let the same file load a
# second time under a different module name, which confuses coverage into reporting a file
# as half-executed when it plainly ran.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external I/O",
    "integration: ephemeral Postgres and Redis",
    "ussd: journey harness driven over SMS and USSD",
    "e2e: full journey specifications",
    "load: sustained-traffic scenarios",
]

[tool.coverage.run]
source = ["apps/api", "packages"]
branch = true
# Test code is scaffolding, not product code; measuring it inflates the reported
# percentage and would mask a genuinely uncovered service.
omit = ["*/tests/*", "*/.gitkeep", "*/alembic/*"]

[tool.coverage.report]
# >=85% line coverage on services/ and packages/*; >=70% overall.
# coverage.py accepts ONE scalar `fail_under`, so this file enforces the 70% aggregate
# default. The 85% scoped gate (services/ + packages/*) is a separate CI step using
# --cov-fail-under=85 over those scopes.
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
