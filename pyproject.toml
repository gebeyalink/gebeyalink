# Tooling + shared-distribution config for apps/api and packages/*.

[project]
name = "gebeyalink"
version = "0.1.0"
description = "GebeyaLink — agricultural marketplace (Ethiopia)"
requires-python = ">=3.12"
# Derived from what the code outside tests/ actually imports, not from what happens to be
# installed on a laptop. Every name here is imported by a module that ships; if a module
# imports something not on this list, CI is the first place that will find out, which is
# the point of it finding out there.
dependencies = [
    "fastapi>=0.115",
    # Imported directly by the error handlers, not only reached through FastAPI.
    "starlette>=0.41",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # The asyncio extra is what pulls greenlet: create_async_engine() needs it, and without
    # it the engine builds and then fails on the first await.
    "sqlalchemy[asyncio]>=2.0",
    # The driver in use is psycopg 3, whose own async support is native — not asyncpg.
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    # apps/api/alembic/env.py imports this, and the deploy pipeline runs `alembic` as a
    # command. A migration tool that is not a declared dependency is a migration tool CI
    # cannot run.
    "alembic>=1.13",
    # apps/api/worker.py imports this. The API never does, but the worker is a process this
    # repository ships and CI runs, and a process whose scheduler is not a declared dependency
    # is a process pip cannot start. Its broker is the Redis already on this list.
    "celery>=5.4",
]

[project.optional-dependencies]
# CI installs `.[dev]` once per job, and every job that imports the application relies on
# that single step.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient is built on httpx, so this is required by the tests themselves
    # rather than merely convenient for them.
    "httpx>=0.27",
    # Tests mint throwaway signing keys with it. Runtime gets it from pyjwt[crypto]; the
    # tests import it directly, so they may not rely on that arriving second-hand.
    "cryptography>=42.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
# Explicit list: prevents setuptools flat-layout auto-discovery from scanning apps/ and
# packages/ and failing with "multiple top-level packages discovered".
packages = [
    "apps",
    "apps.api",
    "apps.api.alembic",
    "apps.api.core",
    "apps.api.db",
    "apps.api.models",
    "apps.api.providers",
    "apps.api.repositories",
    "apps.api.routers",
    # Was missing while the package existed: an editable install works from the source tree
    # regardless, but a real wheel would have shipped without the request and response
    # shapes every router imports.
    "apps.api.schemas",
    "apps.api.services",
    "packages",
    "packages.shared",
    "packages.shared.i18n",
    "packages.shared.messaging",
    "packages.ussd",
    "packages.ussd.trees",
]

[tool.setuptools.package-data]
# Template YAML is runtime data, not Python: a wheel must carry it or the registry
# loader fails at the first send.
"packages.shared.i18n" = ["templates/*.yaml"]

# ── SPEC §19: mypy strict on apps/api, packages/* ─────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# Imports are written relative to the repository root, so that is the only path needed.
# Listing the narrower directories as well would give the same file two module names, which
# mypy rejects outright.
mypy_path = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/mobile", "apps/admin", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test names carry the requirement they prove, which the naming checklist requires; the
# lowercase-function-name rule does not apply to them.
"apps/api/tests/*" = ["N802"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(apps/mobile|apps/admin|infra)/"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
# Only the repository root: every import is absolute from there (``apps.api...``,
# ``packages.shared...``). Adding the narrower directories would let the same file load a
# second time under a different module name, which confuses coverage into reporting a file
# as half-executed when it plainly ran.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external I/O",
    "integration: ephemeral Postgres and Redis",
    "ussd: journey harness driven over SMS and USSD",
    "e2e: full journey specifications",
    "load: sustained-traffic scenarios",
]

[tool.coverage.run]
source = ["apps/api", "packages"]
branch = true
# SQLAlchemy's async engine runs its synchronous database work inside a greenlet, and a
# greenlet switch is invisible to the tracer. Without this the tracer loses the enclosing
# coroutine at the first database await and only re-acquires it at the next one, so every
# pure-Python statement after an await is reported as never run -- `profile_service.update`
# reported `if existing is None:` as uncovered while the test written to drive it passed.
# Measured over 481 tests, this put the services at 82.18% rather than 98.15% and hid that
# offer_service.py was fully covered. `greenlet` teaches the tracer about the switch and
# `thread` does the same for the portal thread the test client runs the app in. Both are
# instrument settings: they only ever credit lines that really executed.
concurrency = ["greenlet", "thread"]
# Test code is scaffolding, not product code; measuring it inflates the reported
# percentage and would mask a genuinely uncovered service.
omit = ["*/tests/*", "*/.gitkeep", "*/alembic/*"]

[tool.coverage.report]
# >=85% line coverage on services/ and packages/*; >=70% overall.
# coverage.py accepts ONE scalar `fail_under`, so this file enforces the 70% aggregate
# default. The 85% scoped gate (services/ + packages/*) is a separate CI step using
# --cov-fail-under=85 over those scopes.
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
