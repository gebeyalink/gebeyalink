# The USSD menus of SPEC §14.2–§14.3, in the same registry and the same language budget as
# the SMS copy.
#
# A USSD prompt is a message by the same rules as a text: written once, in every language,
# classified once, and marked with who wrote its words. The lane is Q2 because these strings
# are replies that never enter a queue — the lane exists because the registry requires a
# classification, not because the USSD path routes through one.
#
# Two shapes recur here, and both are decisions rather than conveniences.
#
# A screen that lists rows is two registry entries: a heading with no placeholders and the
# shared `ussd_rows` sentence the pre-rendered rows are substituted into. The heading is a
# sentence and the rows are data, and keeping them apart lets the same row template render a
# listing, an offer or an order without a second copy of the layout.
#
# A reason line carries no marker. The renderer prepends `❌ `, so the sentence here reads as
# a sentence and the error convention lives in exactly one place.

- id: ussd_greeting
  channel: ussd
  priority: Q2
  review_status: spec_supplied
  variant_review_status:
    am: spec_supplied
    om: unreviewed
    en: spec_supplied
  placeholders: []
  variants:
    am: "ገበያሊንክ እንኳን ደህና መጡ"
    om: "Baga nagaan dhuftan GebeyaLink"
    en: "Welcome to GebeyaLink"

